<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9BB4D4"/></marker>
    <style>
      .chip{fill:#EAF1FA;stroke:#064FA1;stroke-width:2;rx:12}
      .step{fill:#fff;stroke:#C9D8EC;stroke-width:2;rx:12}
      .op{font:600 30px ui-monospace, Menlo, Consolas, monospace;fill:#064FA1}
      .t{font:22px sans-serif;fill:#1a1a1a}
      .m{font:20px ui-monospace, Menlo, Consolas, monospace;fill:#555}
      .lead{font:600 22px sans-serif;fill:#8A2B2F}
      .h{font:600 26px sans-serif;fill:#064FA1}
      .arr{stroke:#9BB4D4;stroke-width:3;marker-end:url(#a)}
    </style>
  </defs>
  <line class="arr" x1="30" y1="110" x2="880" y2="110"/>
  <line x1="100" y1="96" x2="100" y2="124" stroke="#C9D8EC" stroke-width="2"/>
  <circle cx="100" cy="110" r="7" fill="#064FA1"/>
  <text class="t" x="100" y="76" text-anchor="middle">装初值</text>
  <text class="m" x="100" y="152" text-anchor="middle" style="font-size:19px">TH0/TL0</text>
  <line x1="290" y1="96" x2="290" y2="124" stroke="#C9D8EC" stroke-width="2"/>
  <circle cx="290" cy="110" r="7" fill="#064FA1"/>
  <text class="t" x="290" y="76" text-anchor="middle">启动计数</text>
  <text class="m" x="290" y="152" text-anchor="middle" style="font-size:19px">TR0 = 1</text>
  <line x1="480" y1="96" x2="480" y2="124" stroke="#C9D8EC" stroke-width="2"/>
  <circle cx="480" cy="110" r="7" fill="#064FA1"/>
  <text class="t" x="480" y="76" text-anchor="middle">溢出置位</text>
  <text class="m" x="480" y="152" text-anchor="middle" style="font-size:19px">TF0 = 1</text>
  <line x1="670" y1="96" x2="670" y2="124" stroke="#C9D8EC" stroke-width="2"/>
  <circle cx="670" cy="110" r="7" fill="#064FA1"/>
  <text class="t" x="670" y="76" text-anchor="middle">进中断</text>
  <text class="m" x="670" y="152" text-anchor="middle" style="font-size:19px">ISR</text>
