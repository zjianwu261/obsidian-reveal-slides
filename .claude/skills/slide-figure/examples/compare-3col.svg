<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9BB4D4"/></marker>
    <style>
      .chip{fill:#EAF1FA;stroke:#064FA1;stroke-width:2;rx:12}
      .step{fill:#fff;stroke:#C9D8EC;stroke-width:2;rx:12}
      .op{font:600 30px ui-monospace, Menlo, Consolas, monospace;fill:#064FA1}
      .t{font:22px sans-serif;fill:#1a1a1a}
      .m{font:20px ui-monospace, Menlo, Consolas, monospace;fill:#555}
      .lead{font:600 22px sans-serif;fill:#8A2B2F}
      .h{font:600 26px sans-serif;fill:#064FA1}
      .arr{stroke:#9BB4D4;stroke-width:3;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="step" x="10" y="10" width="273" height="210"/>
  <text class="h" x="36" y="56">算术</text>
  <text class="t" x="36" y="102"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">+ - * /</tspan></text>
  <text class="t" x="36" y="142"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">%</tspan> 取余数</text>
  <text class="t" x="36" y="182">整数除法丢小数</text>
  <rect class="chip" x="313" y="10" width="273" height="210"/>
  <text class="h" x="339" y="56">赋值与关系</text>
  <text class="t" x="339" y="102"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">=</tspan> 装进左边</text>
  <text class="t" x="339" y="142"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">==</tspan> <tspan font-family="ui-monospace, Menlo, Consolas, monospace">!=</tspan> 判断真假</text>
  <text class="t" x="339" y="182">两者别混用</text>
  <rect class="step" x="617" y="10" width="273" height="210"/>
  <text class="h" x="643" y="56">自增 / 自减</text>
  <text class="t" x="643" y="102"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">++b</tspan> 先加再用</text>
  <text class="t" x="643" y="142"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">b++</tspan> 先用再加</text>
  <text class="t" x="643" y="182">差别只在时机</text>
</svg>
